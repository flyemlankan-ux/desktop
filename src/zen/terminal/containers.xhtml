<?xml-stylesheet href="chrome://browser/content/zen-terminal/zen-terminal-containers.css" type="text/css"?>

<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <title>Terminal Containers</title>
    <script type="module" src="chrome://browser/content/zen-terminal/ZenTerminalContainers.mjs"></script>
  </head>
  <body>
    <main class="terminal-containers-page">
      <section class="hero">
        <p class="eyebrow">Terminal Containers</p>
        <h1>Separate terminal logins from browser logins.</h1>
        <p>
          Browser containers keep website accounts apart. Terminal containers keep
          terminal sessions apart. Use them for Claude, Codex, servers, or any
          shell setup you want to keep grouped.
        </p>
      </section>

      <section class="panel">
        <h2>Add a terminal container</h2>
        <form id="add-terminal-container-form" class="add-form">
          <input
            id="terminal-container-name"
            autocomplete="off"
            placeholder="Example: Claude, Codex, Chubs, Wendy"
            type="text"
          />
          <button type="submit">Add</button>
        </form>
      </section>

      <section class="panel">
        <h2>Your terminal containers</h2>
        <div id="terminal-containers-list" class="container-list"></div>
      </section>
    </main>
  </body>
</html>
