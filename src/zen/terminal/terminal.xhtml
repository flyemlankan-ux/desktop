<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <title>Terminal</title>
    <link
      rel="stylesheet"
      href="chrome://browser/content/zen-terminal/vendor/xterm.css"
    />
    <link
      rel="stylesheet"
      href="chrome://browser/content/zen-styles/zen-terminal-page.css"
    />
    <script src="chrome://browser/content/zen-terminal/vendor/xterm.js"></script>
    <script src="chrome://browser/content/zen-terminal/vendor/addon-fit.js"></script>
    <script src="chrome://browser/content/zen-terminal/vendor/addon-search.js"></script>
    <script
      type="module"
      src="chrome://browser/content/zen-terminal/ZenTerminalPage.mjs"
    ></script>
  </head>
  <body>
    <main id="zen-terminal-page">
      <section id="zen-terminal-surface" aria-label="Terminal" tabindex="0">
        <div id="zen-terminal-find" role="search" aria-label="Find in terminal scrollback" hidden="hidden">
          <input id="zen-terminal-find-input" type="text" aria-label="Find in terminal scrollback" placeholder="Find in terminal" maxlength="1024" autocomplete="off" spellcheck="false" />
          <button id="zen-terminal-find-previous" type="button" aria-label="Previous match" title="Previous match (Shift+Enter)">↑</button>
          <button id="zen-terminal-find-next" type="button" aria-label="Next match" title="Next match (Enter)">↓</button>
          <button id="zen-terminal-find-close" type="button" aria-label="Close find" title="Close (Escape)">×</button>
          <span id="zen-terminal-find-result" role="status" aria-live="polite" aria-atomic="true"></span>
        </div>
        <div id="zen-terminal-output"></div>
        <footer id="zen-terminal-status">
          <span id="zen-terminal-prompt">…</span>
          <span id="zen-terminal-status-text" role="status" aria-live="polite"
            >starting shell</span
          >
          <button id="zen-terminal-reconnect" type="button" hidden="hidden">
            Reconnect
          </button>
        </footer>
      </section>
    </main>
  </body>
</html>
