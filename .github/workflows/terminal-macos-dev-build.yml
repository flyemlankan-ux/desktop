name: Terminal macOS Dev Build

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Mac CPU target"
        required: true
        default: "aarch64"
        type: choice
        options:
          - "aarch64"
          - "x86_64"
      brand:
        description: "Zen brand config to build from"
        required: true
        default: "release"
        type: choice
        options:
          - "twilight"
          - "release"
      use-sccache:
        description: "Use GitHub build cache"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build terminal Zen for macOS (${{ inputs.arch }})
    runs-on: macos-26
    timeout-minutes: 720
    env:
      SURFER_COMPAT: ${{ inputs.arch }}
      SURFER_PLATFORM: darwin
      ZEN_RELEASE_BRANCH: ${{ inputs.brand }}
      ZEN_RELEASE: "1"
      ZEN_GA_DISABLE_PGO: "true"
      SCCACHE_GHA_ENABLED: ${{ inputs.use-sccache && 'true' || 'false' }}
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Generate build ID
        id: buildid
        shell: bash
        run: |
          echo "id=$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"
          echo "version=155.0.1-terminal-dev-$(date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup Python
        uses: actions/setup-python@v5

      - name: Check terminal wiring before the expensive build
        run: node scripts/terminal-tabs/check-terminal-tabs.mjs

      - name: Run sccache-cache
        # v0.0.10. Pin the commit so a later change to the tag cannot alter this build.
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696
        if: ${{ inputs.use-sccache }}
        with:
          disable_annotations: true

      - name: Expose actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env['ACTIONS_CACHE_URL'])
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN'])

      - name: Install macOS build tools
        shell: bash
        run: |
          brew update
          brew install cairo gnu-tar mercurial watchman tmux
          python3 -m pip install --user mercurial setuptools
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain "$(cat .rust-toolchain)"
          source "$HOME/.cargo/env"
          rustup target add "${{ inputs.arch }}-apple-darwin"
          echo "/usr/local/opt/gnu-tar/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Test terminal logic and native helper
        run: |
          node scripts/terminal-tabs/test-terminal-settings155.mjs
          node scripts/terminal-tabs/test-terminal-recipes.mjs
          node scripts/terminal-tabs/test-terminal-session-persistence.mjs
          node scripts/terminal-tabs/test-terminal-polish.mjs
          python3 scripts/terminal-tabs/test-copy-zen-profiles.py
          scripts/terminal-tabs/build-terminal-pty.sh
          python3 scripts/terminal-tabs/test-terminal-pty.py
          python3 scripts/terminal-tabs/test-sign-terminal-dev-dmg.py

      - name: Prepare terminal fork identity
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("surfer.json")
          data = json.loads(path.read_text())
          data["name"] = "Zen Terminal"
          data["appId"] = "zen-terminal"
          data["binaryName"] = "zen-terminal"
          for brand in data["brands"].values():
              brand["brandShorterName"] = "Zen Terminal"
              brand["brandShortName"] = "Zen Terminal"
              brand["brandFullName"] = "Zen Terminal"
          path.write_text(json.dumps(data, indent=2) + "\n")

          # Surfer merges this local file into the generated Firefox build config.
          # Removing the updater at build time prevents stock Zen from replacing
          # the terminal fork, even if an old profile contains update preferences.
          Path("mozconfig").write_text("ac_add_options --disable-updater\nexport MOZ_APP_PROFILE=zen-terminal\n")
          PY

      - name: Prepare Zen terminal build config
        run: npm run surfer -- ci --brand "${{ inputs.brand }}" --display-version "${{ steps.buildid.outputs.version }}"

      - name: Download Firefox source and dependencies
        run: npm run download -- --verbose

      - name: Import Zen source into Firefox source
        run: npm run import -- --verbose

      - name: Bootstrap Firefox build environment
        shell: bash
        run: |
          cd engine
          export PATH="$(python3 -m site --user-base)/bin:$PATH"
          ./mach --no-interactive bootstrap --application-choice browser --exclude macos-sdk || true

      - name: Build language packs
        run: sh scripts/download-language-packs.sh

      - name: Build Zen terminal fork
        shell: bash
        run: |
          source "$HOME/.cargo/env"
          export MOZ_BUILD_DATE="${{ steps.buildid.outputs.id }}"
          npm run build

      - name: Bundle the native terminal helper
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find engine/obj-* -path '*/dist/*.app' -maxdepth 4 -type d -print -quit)"
          test -n "$app_path"
          ZEN_TERMINAL_ARCH="${{ inputs.arch }}" scripts/terminal-tabs/build-terminal-pty.sh "$app_path/Contents/MacOS/zen-terminal-pty"
          codesign --force --sign - "$app_path/Contents/MacOS/zen-terminal-pty"

      - name: Package macOS app
        shell: bash
        run: |
          source "$HOME/.cargo/env"
          export MOZ_BUILD_DATE="${{ steps.buildid.outputs.id }}"
          set +e
          npm run package
          package_status=$?
          set -e
          if [ "$package_status" -ne 0 ]; then
            echo "surfer package failed after app packaging. Checking whether a DMG was still created."
            if find engine/obj-* -path '*/dist/*.dmg' -print -quit | grep -q .; then
              echo "DMG exists, continuing. This dev build does not need updater MAR files."
            else
              exit "$package_status"
            fi
          fi

      - name: Collect DMG
        shell: bash
        run: |
          set -eux
          mkdir -p terminal-build-artifacts
          dmg_path="$(find engine/obj-* -path '*/dist/*.dmg' -print -quit)"
          test -n "$dmg_path"
          scripts/terminal-tabs/sign-terminal-dev-dmg.sh "$dmg_path" "terminal-build-artifacts/zen-terminal-${{ inputs.arch }}.dmg"
          python3 - <<'PYINFO'
          import hashlib, json, os, subprocess
          from pathlib import Path
          dmg = next(Path("terminal-build-artifacts").glob("*.dmg"))
          Path("terminal-build-artifacts/build-info.json").write_text(json.dumps({
              "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "upstream_stable": "1.22b",
              "firefox_engine": json.loads(Path("surfer.json").read_text())["version"]["version"],
              "workflow_run": os.environ["GITHUB_RUN_ID"],
              "dmg_sha256": hashlib.file_digest(dmg.open("rb"), "sha256").hexdigest(),
              "signing": "development build; not Apple-notarized",
              "personal_data": "not included",
          }, indent=2) + "\n")
          PYINFO
          find terminal-build-artifacts -maxdepth 1 -type f -print

      - name: Inspect packaged terminal app
        shell: bash
        run: |
          scripts/terminal-tabs/inspect-terminal-macos-dmg.sh \
            "terminal-build-artifacts/zen-terminal-${{ inputs.arch }}.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: zen-terminal-${{ inputs.arch }}-dmg
          path: terminal-build-artifacts/
          retention-days: 90
